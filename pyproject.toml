[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grokfilmstudio"
version = "0.1.0"
description = "AI Film Production Automation System - Grok/Flux video workflow orchestration"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "GrokFilmStudio Team"}
]
keywords = [
    "ai",
    "video",
    "film-production",
    "automation",
    "grok",
    "prompt-engineering"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "playwright>=1.40.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "click>=8.1.0",
    "aiohttp>=3.9.0",
    "ffmpeg-python>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.12.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]
ui = [
    "streamlit>=1.29.0",
]
audio = [
    "elevenlabs>=0.2.0",
]
all = [
    "streamlit>=1.29.0",
    "elevenlabs>=0.2.0",
]

[project.scripts]
grokfilm = "grokfilmstudio.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/grokfilmstudio"
Repository = "https://github.com/yourusername/grokfilmstudio.git"
Issues = "https://github.com/yourusername/grokfilmstudio/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
